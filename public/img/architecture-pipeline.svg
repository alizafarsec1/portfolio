<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">PeopleOps six-stage data pipeline architecture</title><desc id="desc">Source files move through ingestion, staging, transformation and quality checks into a star schema warehouse and SQL analytics.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1725"/><stop offset="1" stop-color="#11142b"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62f0e4"/><stop offset="1" stop-color="#a6b8ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#61e8df"/></marker></defs>
<rect width="1400" height="680" rx="28" fill="url(#bg)"/><circle cx="1210" cy="80" r="180" fill="#1ac7c5" opacity=".07" filter="url(#glow)"/><circle cx="180" cy="610" r="180" fill="#7773ff" opacity=".07" filter="url(#glow)"/>
<text x="58" y="66" fill="#61e8df" font-family="Inter,Arial" font-size="16" font-weight="700" letter-spacing="4">PEOPLEOPS / REFERENCE ARCHITECTURE</text><text x="58" y="112" fill="#f1f7ff" font-family="Inter,Arial" font-size="33" font-weight="750">From operational files to trusted analytics</text><text x="58" y="145" fill="#8fa5bd" font-family="Inter,Arial" font-size="16">Repeatable ingestion · observable transformations · warehouse-ready outputs</text>
<g font-family="Inter,Arial"><rect x="55" y="220" width="180" height="154" rx="18" fill="#13243a" stroke="#456179"/><text x="75" y="251" fill="#61e8df" font-size="12" font-weight="700" letter-spacing="2">STAGE 01</text><text x="75" y="286" fill="#f1f7ff" font-size="20" font-weight="700">Source inputs</text><text x="75" y="318" fill="#9fb2c7" font-size="14">HR · attendance</text><text x="75" y="340" fill="#9fb2c7" font-size="14">CSV / flat files</text>
<rect x="275" y="220" width="180" height="154" rx="18" fill="#122b37" stroke="#3b8b91"/><text x="295" y="251" fill="#61e8df" font-size="12" font-weight="700" letter-spacing="2">STAGE 02</text><text x="295" y="286" fill="#f1f7ff" font-size="20" font-weight="700">Ingestion</text><text x="295" y="318" fill="#9fb2c7" font-size="14">Python loader</text><text x="295" y="340" fill="#9fb2c7" font-size="14">File + row checks</text>
<rect x="495" y="220" width="180" height="154" rx="18" fill="#17273b" stroke="#5476ad"/><text x="515" y="251" fill="#90b9ff" font-size="12" font-weight="700" letter-spacing="2">STAGE 03</text><text x="515" y="286" fill="#f1f7ff" font-size="20" font-weight="700">Raw / staging</text><text x="515" y="318" fill="#9fb2c7" font-size="14">SQL Server tables</text><text x="515" y="340" fill="#9fb2c7" font-size="14">Run metadata</text>
<rect x="715" y="220" width="180" height="154" rx="18" fill="#28243e" stroke="#8c7cc4"/><text x="735" y="251" fill="#c4b4ff" font-size="12" font-weight="700" letter-spacing="2">STAGE 04</text><text x="735" y="286" fill="#f1f7ff" font-size="20" font-weight="700">Transform + DQ</text><text x="735" y="318" fill="#b7b4d1" font-size="14">Normalize / assert</text><text x="735" y="340" fill="#b7b4d1" font-size="14">Reject + audit rows</text>
<rect x="935" y="220" width="180" height="154" rx="18" fill="#102e36" stroke="#348e87"/><text x="955" y="251" fill="#61e8df" font-size="12" font-weight="700" letter-spacing="2">STAGE 05</text><text x="955" y="286" fill="#f1f7ff" font-size="20" font-weight="700">Data warehouse</text><text x="955" y="318" fill="#9fb2c7" font-size="14">SCD Type 2 dims</text><text x="955" y="340" fill="#9fb2c7" font-size="14">Star Schema facts</text>
<rect x="1155" y="220" width="190" height="154" rx="18" fill="#152a3e" stroke="#527ba8"/><text x="1175" y="251" fill="#90b9ff" font-size="12" font-weight="700" letter-spacing="2">STAGE 06</text><text x="1175" y="286" fill="#f1f7ff" font-size="20" font-weight="700">Analytics</text><text x="1175" y="318" fill="#9fb2c7" font-size="14">CFO / HR SQL</text><text x="1175" y="340" fill="#9fb2c7" font-size="14">Reconciliation</text>
<g stroke="#61e8df" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M235 297 H267"/><path d="M455 297 H487"/><path d="M675 297 H707"/><path d="M895 297 H927"/><path d="M1115 297 H1147"/></g>
<rect x="275" y="432" width="400" height="110" rx="16" fill="#0c1d2b" stroke="#2d7277"/><text x="298" y="464" fill="#61e8df" font-family="Inter,Arial" font-size="13" font-weight="700" letter-spacing="1.5">REPEATABILITY</text><text x="298" y="493" fill="#eaf4ff" font-family="Inter,Arial" font-size="16" font-weight="650">Deterministic loads + _row_hash</text><text x="298" y="519" fill="#91a7bd" font-family="Inter,Arial" font-size="13">Re-run safely; identify changed records.</text>
<rect x="715" y="432" width="400" height="110" rx="16" fill="#17172c" stroke="#655b9d"/><text x="738" y="464" fill="#c4b4ff" font-family="Inter,Arial" font-size="13" font-weight="700" letter-spacing="1.5">OBSERVABILITY</text><text x="738" y="493" fill="#eaf4ff" font-family="Inter,Arial" font-size="16" font-weight="650">Assertions + rejection audit</text><text x="738" y="519" fill="#a8a6c7" font-family="Inter,Arial" font-size="13">Bad data is visible, counted, and explainable.</text>
<path d="M805 374 V402 H475 V424" fill="none" stroke="#61e8df" stroke-width="1.6" stroke-dasharray="5 6"/><path d="M805 402 H915 V424" fill="none" stroke="#b8a6ff" stroke-width="1.6" stroke-dasharray="5 6"/>
<text x="58" y="630" fill="#657d97" font-family="Inter,Arial" font-size="13">CONCEPTUAL PROJECT ARCHITECTURE · ADAPT TABLE AND SERVICE NAMES TO THE IMPLEMENTATION</text><rect x="58" y="650" width="1284" height="3" rx="2" fill="url(#accent)" opacity=".7"/>
</g></svg>
